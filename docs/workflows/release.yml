# Proposed release workflow. The GitHub App can't push files under
# .github/workflows/, so copy this file there by hand:
#   cp docs/workflows/release.yml .github/workflows/
# Needs the four SISE_* secrets described in README.md ("Releases").
name: Release

on:
  # A pushed tag (git push origin v0.3.0)...
  push:
    tags: ['v*']
  # ...or, from the browser: Actions → Release → Run workflow, with the
  # version. The job then creates the tag on the chosen branch's commit.
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión, sin la v (p. ej. 0.3.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      # Full history: the versionCode is the commit count (app/build.gradle.kts),
      # so each release installs over the previous one.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode the signing keystore
        env:
          SISE_KEYSTORE_BASE64: ${{ secrets.SISE_KEYSTORE_BASE64 }}
        run: |
          echo "$SISE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sise-release.jks"
          echo "SISE_KEYSTORE_PATH=$RUNNER_TEMP/sise-release.jks" >> "$GITHUB_ENV"

      # Tests only read saved fixtures; nothing here touches the live portal.
      - name: Test and build the signed APK
        env:
          SISE_KEYSTORE_PASSWORD: ${{ secrets.SISE_KEYSTORE_PASSWORD }}
          SISE_KEY_ALIAS: ${{ secrets.SISE_KEY_ALIAS }}
          SISE_KEY_PASSWORD: ${{ secrets.SISE_KEY_PASSWORD }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]] || { echo "Not a version tag: $TAG"; exit 1; }
          export SISE_VERSION_NAME="${TAG#v}"
          ./gradlew :sise-core:test testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "sise-tracker-${TAG}.apk"

      # Creates the tag too when the run was started from the browser.
      - name: Attach the APK to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "sise-tracker-${TAG}.apk" \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/sise-release.jks"
